name: Desktop release (Tauri)

# Builds native installers on tag pushes (`v*`).
#
# A cheap `preflight` job validates secrets and config on Ubuntu before the
# expensive bundle/notarize matrix starts, so misconfigured secrets fail in
# under a minute instead of after 15+ minutes of build work.
#
# Required secrets:
# - TAURI_SIGNING_PRIVATE_KEY: rsign2/minisign-compatible secret key in
#   **base64** form (the "Base64 encoded" line from `tauri signer generate`,
#   or `base64 -w 0 < your.key`). Tauri uses rsign2 under the hood, so the
#   decoded first line is "untrusted comment: rsign encrypted secret key";
#   raw minisign keys ("minisign encrypted secret key") also work because
#   the two formats are signature-compatible. Pasting the raw three-line
#   key file (un-base64'd) fails with "Invalid symbol ..." at offset.
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: password for the above key (may be
#   empty if the key was generated without one).
#
# Apple code signing and notarization (App Store Connect API Key auth):
# - APPLE_CERTIFICATE (base64 encoded .p12, Developer ID Application)
# - APPLE_CERTIFICATE_PASSWORD
# - APPLE_API_ISSUER (App Store Connect Issuer UUID)
# - APPLE_API_KEY (App Store Connect Key ID)
# - APPLE_API_KEY_CONTENT (.p8 private key file contents)
#
# Windows code signing is intentionally disabled until certificates are provisioned.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION_FOR_DESKTOP: '22.14.0'

jobs:
  # Validate every signing secret and updater config on a cheap Ubuntu runner
  # before kicking off the long bundle/notarize matrix. Designed to fail in
  # 30-60 s with an actionable error, not after 15 min of build work.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install validation tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign jq
          npm install --no-audit --no-fund --no-save @tauri-apps/cli@2

      - name: Verify required secrets are present
        id: check_secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_CONTENT; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secrets:"
            for n in "${missing[@]}"; do
              echo "::error::  - $n"
            done
            exit 1
          fi
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty; build will assume a passwordless minisign key."
          fi

      - name: Validate TAURI_SIGNING_PRIVATE_KEY (base64 + rsign/minisign format)
        id: check_tauri_key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > /tmp/decoded.key 2>/tmp/b64.err; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not valid base64."
            echo "::error::Expected the 'Base64 encoded' line from \`tauri signer generate\`,"
            echo "::error::or the output of \`base64 -w 0 < your.key\` pasted into the secret."
            sed 's/^/::error::/' /tmp/b64.err || true
            exit 1
          fi
          # `tauri signer generate` uses rsign2 and emits "rsign encrypted
          # secret key"; raw `minisign` produces "minisign encrypted secret
          # key". Both are signature-compatible and accepted by Tauri.
          first_line="$(head -n 1 /tmp/decoded.key)"
          case "$first_line" in
            "untrusted comment: rsign encrypted secret key") ;;
            "untrusted comment: minisign encrypted secret key") ;;
            *)
              echo "::error::Decoded TAURI_SIGNING_PRIVATE_KEY does not look like an rsign/minisign encrypted secret key."
              echo "::error::First line was: $first_line"
              echo "::error::Expected one of:"
              echo "::error::  'untrusted comment: rsign encrypted secret key'   (from \`tauri signer generate\`)"
              echo "::error::  'untrusted comment: minisign encrypted secret key' (from \`minisign -G\`)"
              exit 1
              ;;
          esac

      - name: Validate APPLE_CERTIFICATE (.p12 + password + Developer ID identity)
        id: check_apple_cert
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERT=/tmp/cert.p12
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$CERT" 2>/tmp/b64.err; then
            echo "::error::APPLE_CERTIFICATE is not valid base64. Re-run \`base64 -i Certificates.p12 | pbcopy\` and update the secret."
            sed 's/^/::error::/' /tmp/b64.err || true
            exit 1
          fi
          if ! openssl pkcs12 -in "$CERT" -nokeys -clcerts \
              -passin "pass:${APPLE_CERTIFICATE_PASSWORD}" \
              -out /tmp/cert.pem 2>/tmp/openssl.err; then
            echo "::error::Failed to read APPLE_CERTIFICATE: APPLE_CERTIFICATE_PASSWORD is wrong or the .p12 is corrupt."
            sed 's/^/::error::/' /tmp/openssl.err || true
            exit 1
          fi
          subject="$(openssl x509 -in /tmp/cert.pem -noout -subject)"
          echo "Certificate subject: $subject"
          if ! echo "$subject" | grep -q 'Developer ID Application'; then
            echo "::error::Certificate is not a 'Developer ID Application' cert. Subject was: $subject"
            exit 1
          fi

      - name: Validate APPLE_API_KEY_CONTENT (.p8 PEM bounds)
        id: check_apple_p8
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qF -- '-----BEGIN PRIVATE KEY-----' <<< "$APPLE_API_KEY_CONTENT"; then
            echo "::error::APPLE_API_KEY_CONTENT is missing the '-----BEGIN PRIVATE KEY-----' header."
            exit 1
          fi
          if ! grep -qF -- '-----END PRIVATE KEY-----' <<< "$APPLE_API_KEY_CONTENT"; then
            echo "::error::APPLE_API_KEY_CONTENT is missing the '-----END PRIVATE KEY-----' footer."
            exit 1
          fi

      - name: Validate APPLE_API_KEY (Key ID format)
        id: check_apple_key_id
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$APPLE_API_KEY" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_API_KEY must be a 10-character App Store Connect Key ID (uppercase letters/digits)."
            exit 1
          fi

      - name: Validate APPLE_API_ISSUER (UUID format)
        id: check_apple_issuer
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::APPLE_API_ISSUER must be the App Store Connect issuer UUID (e.g. 12345678-1234-1234-1234-123456789012)."
            exit 1
          fi

      - name: Validate src-tauri/tauri.conf.json (updater config)
        id: check_tauri_conf
        shell: bash
        run: |
          set -euo pipefail
          CONF=src-tauri/tauri.conf.json
          if ! jq empty "$CONF" 2>/tmp/jq.err; then
            echo "::error::$CONF is not valid JSON."
            sed 's/^/::error::/' /tmp/jq.err || true
            exit 1
          fi
          updater_artifacts="$(jq -r '.bundle.createUpdaterArtifacts // false' "$CONF")"
          if [ "$updater_artifacts" != "true" ]; then
            echo "::error::bundle.createUpdaterArtifacts must be true so updater signatures are produced."
            exit 1
          fi
          pubkey="$(jq -r '.plugins.updater.pubkey // ""' "$CONF")"
          if [ -z "$pubkey" ]; then
            echo "::error::plugins.updater.pubkey is empty in $CONF."
            exit 1
          fi
          if ! printf '%s' "$pubkey" | base64 -d > /tmp/pubkey.minisign 2>/tmp/b64.err; then
            echo "::error::plugins.updater.pubkey in $CONF is not valid base64."
            sed 's/^/::error::/' /tmp/b64.err || true
            exit 1
          fi
          first_line="$(head -n 1 /tmp/pubkey.minisign)"
          if [ "$first_line" != "untrusted comment: minisign public key" ]; then
            echo "::error::plugins.updater.pubkey does not decode to a minisign public key."
            echo "::error::First line was: $first_line"
            exit 1
          fi
          endpoints_len="$(jq -r '.plugins.updater.endpoints | length' "$CONF")"
          if [ "$endpoints_len" = "0" ] || [ "$endpoints_len" = "null" ]; then
            echo "::error::plugins.updater.endpoints must be a non-empty array."
            exit 1
          fi

      - name: Cross-check signing key matches updater pubkey
        id: check_sign_verify
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "preflight $(date -u +%FT%TZ)" > /tmp/test.txt
          if ! npx tauri signer sign /tmp/test.txt > /tmp/sign.out 2>/tmp/sign.err; then
            echo "::error::tauri signer sign failed; TAURI_SIGNING_PRIVATE_KEY_PASSWORD is wrong or the secret is corrupt."
            sed 's/^/::error::/' /tmp/sign.err || true
            exit 1
          fi
          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json | base64 -d > /tmp/pubkey.minisign
          if ! minisign -V -p /tmp/pubkey.minisign -m /tmp/test.txt -x /tmp/test.txt.sig > /tmp/verify.out 2>/tmp/verify.err; then
            echo "::error::Updater pubkey in src-tauri/tauri.conf.json does not match TAURI_SIGNING_PRIVATE_KEY."
            echo "::error::Either rotate the secret to the matching key, or update plugins.updater.pubkey in tauri.conf.json."
            sed 's/^/::error::/' /tmp/verify.err || true
            exit 1
          fi

      - name: Preflight summary
        if: always()
        shell: bash
        env:
          R_SECRETS: ${{ steps.check_secrets.outcome }}
          R_TAURI_KEY: ${{ steps.check_tauri_key.outcome }}
          R_APPLE_CERT: ${{ steps.check_apple_cert.outcome }}
          R_APPLE_P8: ${{ steps.check_apple_p8.outcome }}
          R_APPLE_KEY_ID: ${{ steps.check_apple_key_id.outcome }}
          R_APPLE_ISSUER: ${{ steps.check_apple_issuer.outcome }}
          R_TAURI_CONF: ${{ steps.check_tauri_conf.outcome }}
          R_SIGN_VERIFY: ${{ steps.check_sign_verify.outcome }}
        run: |
          icon() {
            case "$1" in
              success) echo "✓" ;;
              failure) echo "✗" ;;
              skipped|"") echo "—" ;;
              *) echo "?" ;;
            esac
          }
          {
            echo "## Preflight checks"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Required secrets present | $(icon "${R_SECRETS}") |"
            echo "| TAURI_SIGNING_PRIVATE_KEY (base64 + minisign) | $(icon "${R_TAURI_KEY}") |"
            echo "| APPLE_CERTIFICATE (.p12 + password) | $(icon "${R_APPLE_CERT}") |"
            echo "| APPLE_API_KEY_CONTENT (.p8 PEM) | $(icon "${R_APPLE_P8}") |"
            echo "| APPLE_API_KEY (Key ID format) | $(icon "${R_APPLE_KEY_ID}") |"
            echo "| APPLE_API_ISSUER (UUID format) | $(icon "${R_APPLE_ISSUER}") |"
            echo "| tauri.conf.json updater config | $(icon "${R_TAURI_CONF}") |"
            echo "| sign + verify cross-check | $(icon "${R_SIGN_VERIFY}") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Pre-create a single draft release so every matrix job can attach assets to
  # the same target without racing on POST /releases.
  create-release:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve tag and version
        id: meta
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${REF_NAME}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          TAG_TO: ${{ github.ref_name }}
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            node scripts/generate-release-notes.mjs
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          BODY: ${{ steps.notes.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --draft=true \
              --title "TTT Desktop $TAG" \
              --notes "$BODY"
          else
            gh release create "$TAG" \
              --draft \
              --title "TTT Desktop $TAG" \
              --notes "$BODY"
          fi

  desktop-build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-arch macOS builds (no universal): each user downloads only the
          # Node.js + native modules for their own architecture, roughly halving
          # the .app/.dmg size compared to a universal build.
          - platform: macos-14
            target: aarch64-apple-darwin
            bundle_targets: darwin-arm64
            arch_label: aarch64
          - platform: macos-13
            target: x86_64-apple-darwin
            bundle_targets: darwin-x64
            arch_label: x64
          - platform: ubuntu-22.04
            target: ''
            bundle_targets: linux-x64
            arch_label: amd64
          - platform: windows-latest
            target: ''
            bundle_targets: win-x64
            arch_label: x64

    runs-on: ${{ matrix.platform }}

    env:
      TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
      TAURI_BUNDLE_TARGETS: ${{ matrix.bundle_targets }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Sync tauri.conf.json version with tag
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
            console.log('tauri.conf.json version set to', conf.version);
          "

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            file

      - name: Install root JS dependencies
        run: npm install --no-audit --no-fund

      - name: Import Apple Developer ID certificate (macOS)
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PWD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Prepend our build keychain to the user search list so codesign
          # discovers the imported identity without depending on the login chain.
          USER_KEYCHAINS="$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $USER_KEYCHAINS

          CERT_FILE="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          rm -f "$CERT_FILE"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' \
            | head -n 1 \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found after import."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "Resolved signing identity: $IDENTITY"

          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_SIGNING_KEYCHAIN=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          P8_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$P8_PATH"
          chmod 600 "$P8_PATH"
          echo "APPLE_API_KEY_PATH=$P8_PATH" >> "$GITHUB_ENV"

      - name: Build desktop bundles
        shell: bash
        env:
          # `tauri build` reads the minisign updater key directly from this
          # env var (base64-decoded inline). Preflight already verified the
          # secret decodes to a valid minisign key, matches the pubkey in
          # tauri.conf.json, and that the password unlocks it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarization credentials are only consumed on macOS builds;
          # on other platforms these env vars are simply unset and ignored.
          # APPLE_API_KEY_PATH is exported via $GITHUB_ENV in the certificate
          # import step above and is therefore visible to Tauri here.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -e
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --target ${{ matrix.target }}
          else
            npx tauri build
          fi

      - name: Notarize and staple macOS DMG
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          for dmg in "$BUNDLE_DIR"/dmg/*.dmg; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
          done

      - name: Disambiguate macOS updater bundle filenames
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          ARCH="${{ matrix.arch_label }}"
          shopt -s nullglob
          for f in "$BUNDLE_DIR"/*.app.tar.gz "$BUNDLE_DIR"/*.app.tar.gz.sig; do
            base="$(basename "$f")"
            # Skip files that already include the arch suffix (idempotent).
            if [[ "$base" == *"_${VERSION}_${ARCH}."* ]]; then
              continue
            fi
            stem="${base%%.app.tar.gz*}"
            suffix="${base#${stem}.app.tar.gz}"
            new="${stem}_${VERSION}_${ARCH}.app.tar.gz${suffix}"
            mv "$f" "$BUNDLE_DIR/$new"
          done

      - name: Upload macOS artifacts to release
        if: startsWith(matrix.platform, 'macos-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          shopt -s nullglob
          assets=()
          for f in "$BUNDLE_DIR"/dmg/*.dmg \
                   "$BUNDLE_DIR"/macos/*.app.tar.gz \
                   "$BUNDLE_DIR"/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && assets+=("$f")
          done
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No macOS artifacts found under $BUNDLE_DIR"
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Upload Linux artifacts to release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/release/bundle"
          shopt -s nullglob
          assets=()
          for f in "$BUNDLE_DIR"/deb/*.deb \
                   "$BUNDLE_DIR"/rpm/*.rpm \
                   "$BUNDLE_DIR"/appimage/*.AppImage \
                   "$BUNDLE_DIR"/appimage/*.AppImage.sig; do
            [ -f "$f" ] && assets+=("$f")
          done
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No Linux artifacts found under $BUNDLE_DIR"
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Upload Windows artifacts to release
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/release/bundle"
          shopt -s nullglob
          assets=()
          for f in "$BUNDLE_DIR"/msi/*.msi \
                   "$BUNDLE_DIR"/msi/*.msi.zip \
                   "$BUNDLE_DIR"/msi/*.msi.zip.sig \
                   "$BUNDLE_DIR"/nsis/*-setup.exe \
                   "$BUNDLE_DIR"/nsis/*.nsis.zip \
                   "$BUNDLE_DIR"/nsis/*.nsis.zip.sig; do
            [ -f "$f" ] && assets+=("$f")
          done
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No Windows artifacts found under $BUNDLE_DIR"
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Cleanup macOS keychain
        if: always() && startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          if [ -n "${APPLE_SIGNING_KEYCHAIN:-}" ] && [ -f "${APPLE_SIGNING_KEYCHAIN}" ]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN" || true
          fi

  publish-release:
    needs: [create-release, desktop-build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_TO: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$(node scripts/generate-release-notes.mjs)"
          NOTES="$NOTES" node scripts/build-updater-manifest.mjs > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      - name: Promote release to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false
