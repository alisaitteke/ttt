name: Desktop release (Tauri)

# Builds native installers on tag pushes (`v*`).
#
# Required secrets:
# - TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (minisign; see README)
#
# Apple code signing and notarization (enabled):
# - APPLE_CERTIFICATE (base64 encoded .p12)
# - APPLE_CERTIFICATE_PASSWORD
# - APPLE_ID (Apple ID email)
# - APPLE_PASSWORD (app-specific password)
# - APPLE_TEAM_ID (10-char team identifier)
#
# Windows code signing (optional):
# - WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD


on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauri_args: '--target universal-apple-darwin'
            bundle_targets: darwin-arm64,darwin-x64
          - platform: ubuntu-22.04
            tauri_args: ''
            bundle_targets: linux-x64
          - platform: windows-latest
            tauri_args: ''
            bundle_targets: win-x64

    runs-on: ${{ matrix.platform }}

    env:
      NODE_VERSION_FOR_DESKTOP: '22.14.0'
      TAURI_BUNDLE_TARGETS: ${{ matrix.bundle_targets }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets (mac universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache apt packages (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux desktop dependencies (WebKitGTK)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install root JS dependencies
        run: npm install --no-audit --no-fund

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            node scripts/generate-release-notes.mjs
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          TAG_TO: ${{ github.ref_name }}

      # Two-attempt build: Apple's Notary Service occasionally returns transient
      # 5xx errors that cause `tauri-action` to fail mid-bundle. Retrying within
      # the same job is much faster than a full re-run because the Rust target
      # cache and node_modules are still warm.
      - name: Build Tauri installers and updater manifest
        id: tauri_build
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_VERSION_FOR_DESKTOP: ${{ env.NODE_VERSION_FOR_DESKTOP }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing and notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing disabled - uncomment and add secrets to enable
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TTT Desktop ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.tauri_args }}

      - name: Backoff before build retry
        if: steps.tauri_build.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::First build attempt failed; sleeping 90s before retry (likely transient Apple Notary 5xx)."
          sleep 90

      - name: Build Tauri installers and updater manifest (retry)
        if: steps.tauri_build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_VERSION_FOR_DESKTOP: ${{ env.NODE_VERSION_FOR_DESKTOP }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TTT Desktop ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.tauri_args }}
