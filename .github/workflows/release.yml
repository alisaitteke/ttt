name: Desktop release (Tauri)

# Builds native installers on tag pushes (`v*`).
#
# Required secrets:
# - TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (minisign; see README)
#
# Apple code signing and notarization (App Store Connect API Key auth):
# - APPLE_CERTIFICATE (base64 encoded .p12)
# - APPLE_CERTIFICATE_PASSWORD
# - APPLE_API_ISSUER (App Store Connect Issuer UUID)
# - APPLE_API_KEY (App Store Connect Key ID)
# - APPLE_API_KEY_CONTENT (.p8 private key file contents)
#
# Windows code signing (optional):
# - WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD


on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-create a draft release in a single job so the parallel matrix below can
  # only upload assets to it. This avoids the race condition where multiple
  # matrix jobs try to POST /releases concurrently and one of them gets
  # "Resource not accessible by integration" from the GitHub API.
  # See: https://github.com/tauri-apps/tauri-action/issues/914
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate release notes
        id: release_notes
        shell: bash
        env:
          TAG_TO: ${{ github.ref_name }}
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            node scripts/generate-release-notes.mjs
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.release_notes.outputs.body }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `TTT Desktop ${tag}`,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: false,
            });
            core.setOutput('release_id', data.id);

  desktop-build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-arch macOS builds (no universal): each user downloads only the
          # Node.js + native modules for their own architecture, roughly halving
          # the .app/.dmg size compared to a universal build.
          - platform: macos-14
            tauri_args: '--target aarch64-apple-darwin'
            bundle_targets: darwin-arm64
          - platform: macos-13
            tauri_args: '--target x86_64-apple-darwin'
            bundle_targets: darwin-x64
          - platform: ubuntu-22.04
            tauri_args: ''
            bundle_targets: linux-x64
          - platform: windows-latest
            tauri_args: ''
            bundle_targets: win-x64

    runs-on: ${{ matrix.platform }}

    env:
      NODE_VERSION_FOR_DESKTOP: '22.14.0'
      TAURI_BUNDLE_TARGETS: ${{ matrix.bundle_targets }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target (macOS arm64)
        if: matrix.platform == 'macos-14'
        run: rustup target add aarch64-apple-darwin

      - name: Add Rust target (macOS x64)
        if: matrix.platform == 'macos-13'
        run: rustup target add x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache apt packages (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux desktop dependencies (WebKitGTK)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install root JS dependencies
        run: npm install --no-audit --no-fund

      - name: Provision App Store Connect API key (macOS)
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Build Tauri installers and updater manifest
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_VERSION_FOR_DESKTOP: ${{ env.NODE_VERSION_FOR_DESKTOP }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing and notarization (App Store Connect API Key)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          # Windows code signing disabled - uncomment and add secrets to enable
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          # Mitigates the parallel-upload race for latest.json
          # (https://github.com/tauri-apps/tauri-action/issues/1270)
          retryAttempts: 3
          args: ${{ matrix.tauri_args }}

  # Promote draft to public only after every matrix job uploaded its assets.
  # If any platform fails the release stays as a draft, avoiding partial releases.
  publish-release:
    needs: [create-release, desktop-build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
