name: Desktop release (Tauri)

# Builds native installers on tag pushes (`v*`).
#
# Required secrets:
# - TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (minisign; see README)
#
# Apple code signing and notarization (App Store Connect API Key auth):
# - APPLE_CERTIFICATE (base64 encoded .p12)
# - APPLE_CERTIFICATE_PASSWORD
# - APPLE_API_ISSUER (App Store Connect Issuer UUID)
# - APPLE_API_KEY (App Store Connect Key ID)
# - APPLE_API_KEY_CONTENT (.p8 private key file contents)
#
# Windows code signing (optional):
# - WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD


on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauri_args: '--target universal-apple-darwin'
            bundle_targets: darwin-arm64,darwin-x64
          - platform: ubuntu-22.04
            tauri_args: ''
            bundle_targets: linux-x64
          - platform: windows-latest
            tauri_args: ''
            bundle_targets: win-x64

    runs-on: ${{ matrix.platform }}

    env:
      NODE_VERSION_FOR_DESKTOP: '22.14.0'
      TAURI_BUNDLE_TARGETS: ${{ matrix.bundle_targets }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets (mac universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache apt packages (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux desktop dependencies (WebKitGTK)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install root JS dependencies
        run: npm install --no-audit --no-fund

      - name: Provision App Store Connect API key (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            node scripts/generate-release-notes.mjs
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          TAG_TO: ${{ github.ref_name }}

      - name: Build Tauri installers and updater manifest
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_VERSION_FOR_DESKTOP: ${{ env.NODE_VERSION_FOR_DESKTOP }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing and notarization (App Store Connect API Key)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          # Windows code signing disabled - uncomment and add secrets to enable
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TTT Desktop ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.tauri_args }}
