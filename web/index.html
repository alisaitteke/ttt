<!doctype html>
<html lang="en-US" dir="ltr">
  <head>
    <script>
      (function () {
        try {
          var LEGACY = { en: 'en-US', es: 'es-ES', zh: 'zh-CN', de: 'de-DE', tr: 'tr-TR', ar: 'ar-SA' };
          var SUPPORTED = { 'en-US': 1, 'es-ES': 1, 'zh-CN': 1, 'de-DE': 1, 'tr-TR': 1, 'ar-SA': 1 };
          var raw = localStorage.getItem('ttt-locale');
          if (!raw) return;
          var loc = LEGACY[raw] || raw;
          if (!SUPPORTED[loc]) return;
          document.documentElement.setAttribute('lang', loc);
          document.documentElement.setAttribute('dir', loc === 'ar-SA' ? 'rtl' : 'ltr');
        } catch (_) {
          /* ignore */
        }
      })();
    </script>
    <script>
      (function () {
        function apply() {
          try {
            var s = localStorage.getItem('ttt-theme');
            if (s === 'light') {
              document.documentElement.classList.remove('dark');
              return;
            }
            if (s === 'dark') {
              document.documentElement.classList.add('dark');
              return;
            }
          } catch {
            /* ignore */
          }
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          } catch {
            document.documentElement.classList.remove('dark');
          }
        }
        apply();
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ps-logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>TTT - The Tortoise Trainer</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
