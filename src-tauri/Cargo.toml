[package]
name = "ttt-desktop"
version = "0.2.7"
edition = "2021"
publish = false
description = "Tauri shell for TTT — hosts the bundled Node UI server inside a desktop window."

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = "symbols"
lto = true
